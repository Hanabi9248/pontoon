name: Publish validated Pontoon plural revision
on:
  push:
    branches: [codex/prepare-catchall-mapping]
    paths: [.github/workflows/prepare-catchall-mapping.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 277ccb182fc2acd23b78c6667eba79edcc96dfd9
      - name: Apply verified revision
        env:
          PATCH_BASE64: 
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/pontoon
          test "$(git ls-remote --heads origin refs/heads/codex/copy-complete-locale-translations | cut -f1)" = 277ccb182fc2acd23b78c6667eba79edcc96dfd9
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/revision.diff
          git apply --index /tmp/revision.diff
          test "$(git write-tree)" = 889b3a28bf26bbb6979502066358da591c212b4b
          git -c user.name=Hanabi -c user.email=317387557+Hanabi9248@users.noreply.github.com commit -m 'Preserve catchall patterns across plural category names'
          git push origin HEAD:refs/heads/codex/copy-complete-locale-translations
