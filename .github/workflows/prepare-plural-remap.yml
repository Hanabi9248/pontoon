name: Publish validated Pontoon plural revision
on:
  push:
    branches: [codex/prepare-plural-remap]
    paths: [.github/workflows/prepare-plural-remap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: b47844c5f393dc2792d97d5deba3db8e40fc7ce0
      - name: Apply verified revision
        env:
          PATCH_BASE64: 
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/pontoon
          test "$(git ls-remote --heads origin refs/heads/codex/copy-complete-locale-translations | cut -f1)" = b47844c5f393dc2792d97d5deba3db8e40fc7ce0
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/revision.diff
          git apply --index /tmp/revision.diff
          test "$(git write-tree)" = 5d4bc4594df3323187c25ff0a471f289eda3c44e
          git -c user.name=Hanabi -c user.email=317387557+Hanabi9248@users.noreply.github.com commit -m 'Remap copied translations to target plural categories'
          git push origin HEAD:refs/heads/codex/copy-complete-locale-translations
