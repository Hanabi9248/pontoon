name: Publish validated Pontoon plural revision
on:
  push:
    branches: [codex/prepare-missing-plurals]
    paths: [.github/workflows/prepare-missing-plurals.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 567356acdab3f1709073dac00e22ebea4fdb6bc5
      - name: Apply verified revision
        env:
          PATCH_BASE64: 
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/pontoon
          test "$(git ls-remote --heads origin refs/heads/codex/copy-complete-locale-translations | cut -f1)" = 567356acdab3f1709073dac00e22ebea4fdb6bc5
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/revision.diff
          git apply --index /tmp/revision.diff
          test "$(git write-tree)" = 1c2cb04653e7f668f58229aea446713ddc2b619c
          git -c user.name=Hanabi -c user.email=317387557+Hanabi9248@users.noreply.github.com commit -m 'Keep missing target plural forms empty when copying locales'
          git push origin HEAD:refs/heads/codex/copy-complete-locale-translations
